<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal práctica</title>
    <link rel="icon" href="../imagenes/logo_redondo.png" type="images/x-icon">
    <link rel="stylesheet" href="../estilos/general.css">
    <link rel="stylesheet" href="../estilos/home.css">
    <script src="../scripts/general.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.0/jspdf.umd.min.js"></script>
</head>

<body>
    <img id="btnCerrarSesion" src="../imagenes/cerrar_sesion.png" alt="Cerrar sesión" onclick="window.history.back()">
    <button id="btnTranscripciones" class="oculto" alt="Ejercicios transcripción" data-atajo="t"
        onclick="irAPagina('transcripcion')">✏️</button>
    <div class="container">
        <h1 id="saludo">Hola, Usuario</h1>
        <div class="contenedorBotones">
            <div class="filaArriba">
                <div class="envolturaSeccion">
                    <button id="btnConsonantes" class="btnSeccion" data-atajo="1" onclick="irAPagina('consonantes')">
                        <span class="textoBtn">Consonantes</span>
                    </button>
                </div>
                <div class="envolturaSeccion">
                    <button id="btnVocales" class="btnSeccion" data-atajo="2" onclick="irAPagina('vocales')">
                        <span class="textoBtn">Vocales</span>
                    </button>
                </div>
            </div>
            <div class="filaAbajo">
                <div class="envolturaSeccion">
                    <button id="btnExtra" class="btnSeccion" data-atajo="3" onclick="irAPagina('extra')">
                        <span class="textoBtn">Extra</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <button id="btnCertificado" class="oculto" alt="Certificado finalización" data-atajo="4"
        onclick="descargarCertificado()">🏅</button>

    <div id="barraProgreso" class="barraProgreso">
        <div class="pistaProgreso">
            <div id="rellenoProgreso" class="rellenoProgreso">
                <div id="destacadoProgreso" class="destacadoProgreso"></div>
            </div>
            <div class="marcaProgreso marca25"></div>
            <div class="marcaProgreso marca50"></div>
            <div class="marcaProgreso marca75"></div>
            <div class="etiquetaBarraProgreso">PROGRESO</div>
        </div>
    </div>

    <div id="modalDesbloqueos" class="modalDesbloqueos oculto">
        <div class="cajaDesbloqueos">
            <h2>🔑 ¡Nuevos desbloqueos!</h2>
            <div id="listaDesbloqueos" class="listaDesbloqueos"></div>
            <button id="btnCerrarDesbloqueos" type="button" class="botonCerrarDesbloqueos">Cerrar</button>
        </div>
    </div>

    <script>
        var identificador, nombre, genero, progreso, cursoFinalizado, token;
        window.onload = function () {
            identificador = sessionStorage.getItem('idUsuario');
            nombre = sessionStorage.getItem('nombre');
            genero = sessionStorage.getItem('genero');
            progreso = parseInt(sessionStorage.getItem('progreso'), 10);
            cursoFinalizado = sessionStorage.getItem('cursoFinalizado');
            token = sessionStorage.getItem('token');

            if (identificador && nombre && genero && tokenEsValido(token, identificador)) {
                var saludo = genero.toLowerCase() === 'hombre' ? 'Bienvenido' : 'Bienvenida';
                saludo = `${saludo}, ${nombre}`;
                document.getElementById('saludo').textContent = saludo;
                // ¿Consonantes prohibidas?
                const btnConsonantes = document.getElementById('btnConsonantes');
                if (progreso < UMBRALES.seccionConsonantes) {
                    btnConsonantes.classList.add('prohibido');
                    btnConsonantes.onclick = function () {
                        prohibido();
                    };
                }
                // ¿Vocales prohibidas?
                const btnVocales = document.getElementById('btnVocales');
                if (progreso < UMBRALES.seccionVocales) {
                    btnVocales.classList.add('prohibido');
                    btnVocales.onclick = function () {
                        prohibido();
                    };
                }
                // ¿Extra prohibida?
                const btnExtra = document.getElementById('btnExtra');
                if (progreso < UMBRALES.seccionExtra) {
                    btnExtra.classList.add('prohibido');
                    btnExtra.onclick = function () {
                        prohibido();
                    };
                }
                if (cursoFinalizado != "no") {
                    document.getElementById("btnTranscripciones").classList.remove("oculto");
                    document.getElementById("btnCertificado").classList.remove("oculto");
                } else if (progreso >= UMBRALES.transcripcionInicial) {
                    document.getElementById("btnTranscripciones").classList.remove("oculto");
                }

                // Barra de progreso general del curso: la colocamos ya (sin animar) en el
                // porcentaje que tenía la última vez que este alumno entró en este
                // dispositivo (el mismo dato que usa la animación de desbloqueos de abajo,
                // así que lo leemos aquí ANTES de que revisarDesbloqueosNuevos lo
                // sobrescriba). El crecimiento animado hasta el porcentaje actual se dispara
                // más abajo, DESPUÉS de que revisarDesbloqueosNuevos haya terminado (lo que
                // incluye esperar a que el alumno cierre el modal de desbloqueos si lo hubo):
                // si animásemos ya, quedaría escondida detrás del modal y el alumno no la
                // vería moverse.
                const progresoAnteriorGuardado = localStorage.getItem('progresoVisto_' + identificador);
                const progresoAnterior = progresoAnteriorGuardado === null ? progreso : parseInt(progresoAnteriorGuardado, 10);
                const calcularPorcentaje = valor => Math.min(100, Math.round((valor / UMBRALES.progresoMaximo) * 100));
                const porcentajeAnterior = calcularPorcentaje(progresoAnterior);
                const porcentajeActual = calcularPorcentaje(progreso);
                const rellenoProgreso = document.getElementById('rellenoProgreso');
                document.getElementById('barraProgreso').title = 'Progreso del curso: ' + porcentajeActual + '%';
                rellenoProgreso.style.width = porcentajeAnterior + '%';
                rellenoProgreso.style.height = porcentajeAnterior + '%';

                // Animación de "nuevos desbloqueos" desde la última vez en este dispositivo.
                // Las insignias de las secciones dependen de lo que esta función registre
                // como "recién desbloqueado", así que esperamos a que termine antes de
                // calcularlas. revisarDesbloqueosNuevos no se da por terminada hasta que el
                // alumno cierra el modal (si lo hubo), así que la barra crece justo después.
                revisarDesbloqueosNuevos(identificador, progreso).then(() => {
                    actualizarInsigniasSecciones(identificador, progreso);
                    animarBarraProgreso(porcentajeAnterior, porcentajeActual);
                });
            } else {
                cerrarSesion();
            }

            const btnConsonantes = document.getElementById("btnConsonantes");
            const btnVocales = document.getElementById("btnVocales");
            const btnCerrarSesion = document.getElementById("btnCerrarSesion");
            const btnTranscripciones = document.getElementById("btnTranscripciones");
            const btnCertificado = document.getElementById("btnCertificado");
            document.addEventListener('keydown', function (event) {
                if (event.key === '1' || event.key == 'c') btnConsonantes.click();
                else if (event.key === '2' || event.key == 'v') btnVocales.click();
                else if (event.key === '3' || event.key == 'e') btnExtra.click();
                else if ((event.key === 't' || event.key == 'T') && !btnTranscripciones.classList.contains('oculto')) btnTranscripciones.click();
                else if (event.key === '4' && !btnCertificado.classList.contains('oculto')) btnCertificado.click();
                else if (event.key === 'Escape' || event.key === '0') btnCerrarSesion.click();
            });
        }

        // Si el navegador restaura esta página desde la bfcache (p. ej. al volver
        // con el botón "atrás" tras visitar una sección), el DOM restaurado
        // conserva las insignias tal como estaban antes de salir, aunque
        // localStorage ya se haya actualizado mientras tanto. Las recalculamos
        // para que reflejen el estado real. (No relanzamos todo window.onload:
        // volvería a registrar el listener de teclado de ahí arriba).
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) actualizarInsigniasSecciones(identificador, progreso);
        });

        // Compara el progreso actual con el último visto EN ESTE DISPOSITIVO
        // (localStorage, por alumno) y anima los tests/textos que se hayan
        // desbloqueado desde entonces. Si es la primera vez que este alumno
        // entra desde este dispositivo/navegador no hay nada con qué comparar,
        // así que no se anima nada: solo se guarda el progreso actual como
        // punto de partida en silencio (evita que un cambio de dispositivo o
        // un borrado de caché muestre TODO como recién desbloqueado).
        async function revisarDesbloqueosNuevos(identificador, progresoActual) {
            const clave = 'progresoVisto_' + identificador;
            const valorGuardado = localStorage.getItem(clave);

            if (valorGuardado === null) {
                localStorage.setItem(clave, progresoActual);
                return;
            }

            const progresoAnterior = parseInt(valorGuardado, 10);
            localStorage.setItem(clave, progresoActual);

            if (progresoActual <= progresoAnterior) return;

            const esNuevo = item => item.desbloqueador > progresoAnterior && item.desbloqueador <= progresoActual;
            let nuevosItems = [];

            try {
                const [resConsonantes, resVocales, resExtra, resTextosConsonantes, resTextosVocales, resTranscripciones] = await Promise.all([
                    fetch('../json/catalogos/consonantes.json'),
                    fetch('../json/catalogos/vocales.json'),
                    fetch('../json/catalogos/extra.json'),
                    fetch('../json/textos/consonantes.json'),
                    fetch('../json/textos/vocales.json'),
                    fetch('../json/transcripciones.json')
                ]);
                const [datosConsonantes, datosVocales, datosExtra, datosTextosConsonantes, datosTextosVocales, datosTranscripciones] =
                    await Promise.all([resConsonantes.json(), resVocales.json(), resExtra.json(), resTextosConsonantes.json(), resTextosVocales.json(), resTranscripciones.json()]);

                // `clave` identifica el ítem para el sistema de insignias (mismo formato
                // que usan cargarInfoBotones/actualizarInsigniaTextos/actualizarInsigniasSecciones).
                // Las transcripciones no tienen caja propia, así que no llevan clave.
                const itemsCatalogo = (datos, categoria, seccion) => datos.items
                    .filter(esNuevo)
                    .map(item => ({ categoria, nombre: item.nombreDesbloqueo, desbloqueador: item.desbloqueador, clave: seccion + ':' + item.destino }));

                const itemsTextos = (datos, categoria, seccion) => datos.textos
                    .filter(esNuevo)
                    .map(t => ({ categoria, nombre: t.titulo, desbloqueador: t.desbloqueador, clave: seccion + ':texto:' + t.titulo }));

                const itemsTranscripciones = Object.entries(datosTranscripciones.niveles || {})
                    .filter(([, umbral]) => esNuevo({ desbloqueador: umbral }))
                    .map(([nombreNivel, umbral]) => ({ categoria: 'Transcripciones', nombre: `Transcripciones: nivel ${nombreNivel}`, desbloqueador: umbral }));

                nuevosItems = [].concat(
                    itemsCatalogo(datosConsonantes, 'Consonantes', 'consonantes'),
                    itemsTextos(datosTextosConsonantes, 'Textos de consonantes', 'consonantes'),
                    itemsCatalogo(datosVocales, 'Vocales', 'vocales'),
                    itemsTextos(datosTextosVocales, 'Textos de vocales', 'vocales'),
                    itemsTranscripciones,
                    itemsCatalogo(datosExtra, 'Extra', 'extra')
                );
            } catch (error) {
                console.error('No se pudieron cargar los catálogos para la animación de desbloqueos:', error);
            }

            if (nuevosItems.length === 0) return;

            // Registramos como insignias pendientes los ítems recién desbloqueados
            // (excepto transcripciones, que no tienen caja propia donde mostrarla).
            agregarInsigniasPendientes(identificador, nuevosItems.filter(item => item.clave).map(item => item.clave));

            // Agrupamos por categoría (en vez de una única lista cronológica) para
            // que la cabecera de cada categoría no aparezca repetida si sus
            // umbrales se entrelazan con los de otra.
            const ordenCategorias = ['Consonantes', 'Textos de consonantes', 'Vocales', 'Textos de vocales', 'Transcripciones', 'Extra'];
            nuevosItems.sort((a, b) => {
                const diferenciaCategoria = ordenCategorias.indexOf(a.categoria) - ordenCategorias.indexOf(b.categoria);
                return diferenciaCategoria !== 0 ? diferenciaCategoria : a.desbloqueador - b.desbloqueador;
            });
            // Esperamos a que el alumno cierre el modal antes de dar esto por terminado
            // (quien llama a revisarDesbloqueosNuevos usa ese momento para lanzar la
            // animación de la barra de progreso, que si no quedaría oculta detrás del modal).
            await mostrarModalDesbloqueos(nuevosItems);
        }

        // Enciende el circulito de "nuevo" en los 3 botones de sección si
        // dentro de esa sección (tests o textos) hay algo desbloqueado que el
        // alumno todavía no ha abierto. Se recalcula en cada carga (a
        // diferencia de la animación de arriba, que solo compara contra la
        // última visita) porque es un estado derivado, no un evento puntual.
        //
        // Cuando el navegador entra en bfcache con un fetch todavía en curso
        // (p. ej. si el alumno hace clic en "Consonantes" justo mientras esta
        // función seguía cargando datos), esa petición puede quedar "congelada"
        // y reanudarse al volver, escribiendo en el DOM con datos obsoletos
        // DESPUÉS de que la llamada nueva (disparada por pageshow) ya haya
        // pintado el estado correcto. El contador `idLlamada` descarta el
        // resultado de cualquier llamada que haya quedado superada por otra más reciente.
        let ultimaLlamadaInsigniasSecciones = 0;
        async function actualizarInsigniasSecciones(identificador, progreso) {
            const idLlamada = ++ultimaLlamadaInsigniasSecciones;
            const pendientes = obtenerInsigniasPendientes(identificador);

            async function hayNuevoEnCatalogo(rutaCatalogo, seccion) {
                const respuesta = await fetch(rutaCatalogo);
                const { items } = await respuesta.json();
                return items.some(item => progreso >= item.desbloqueador && pendientes.has(seccion + ':' + item.destino));
            }

            async function hayNuevoEnTextos(rutaTextos, seccion) {
                const respuesta = await fetch(rutaTextos);
                const datos = await respuesta.json();
                return datos.textos.some(t => progreso >= t.desbloqueador && pendientes.has(seccion + ':texto:' + t.titulo));
            }

            // La insignia se coloca en la envoltura (no en el propio botón): el botón
            // lleva un filter:grayscale mientras no está en hover, y ese filtro también
            // apagaría el rojo de la insignia si fuera hija suya.
            try {
                const [consoNuevo, consoTextoNuevo] = await Promise.all([
                    hayNuevoEnCatalogo('../json/catalogos/consonantes.json', 'consonantes'),
                    hayNuevoEnTextos('../json/textos/consonantes.json', 'consonantes')
                ]);
                if (idLlamada !== ultimaLlamadaInsigniasSecciones) return;
                actualizarInsignia(document.getElementById('btnConsonantes').parentElement, consoNuevo || consoTextoNuevo);

                const [vocNuevo, vocTextoNuevo] = await Promise.all([
                    hayNuevoEnCatalogo('../json/catalogos/vocales.json', 'vocales'),
                    hayNuevoEnTextos('../json/textos/vocales.json', 'vocales')
                ]);
                if (idLlamada !== ultimaLlamadaInsigniasSecciones) return;
                actualizarInsignia(document.getElementById('btnVocales').parentElement, vocNuevo || vocTextoNuevo);

                const extraNuevo = await hayNuevoEnCatalogo('../json/catalogos/extra.json', 'extra');
                if (idLlamada !== ultimaLlamadaInsigniasSecciones) return;
                actualizarInsignia(document.getElementById('btnExtra').parentElement, extraNuevo);
            } catch (error) {
                console.error('No se pudieron comprobar los nuevos desbloqueos de las secciones:', error);
            }
        }

        // Devuelve una promesa que no se resuelve hasta que el alumno cierra el
        // modal, para que quien lo llama pueda esperar a ese momento (p. ej. para no
        // lanzar la animación de la barra de progreso mientras el modal la tapa).
        function mostrarModalDesbloqueos(items) {
            const lista = document.getElementById('listaDesbloqueos');
            lista.innerHTML = '';

            let categoriaActual = null;
            let indice = 0;
            items.forEach(item => {
                if (item.categoria !== categoriaActual) {
                    categoriaActual = item.categoria;
                    const grupo = document.createElement('div');
                    grupo.className = 'grupoDesbloqueos';
                    grupo.textContent = categoriaActual;
                    lista.appendChild(grupo);
                }
                const el = document.createElement('div');
                el.className = 'itemDesbloqueo';
                el.style.setProperty('--i', indice);
                el.innerHTML = `<span>🔓</span><span>${item.nombre}</span>`;
                lista.appendChild(el);
                indice++;
            });

            document.getElementById('modalDesbloqueos').classList.remove('oculto');

            return new Promise(resolve => {
                document.getElementById('btnCerrarDesbloqueos').addEventListener('click', function alCerrar() {
                    document.getElementById('modalDesbloqueos').classList.add('oculto');
                    resolve();
                }, { once: true });
            });
        }

        // Anima el crecimiento de la barra de progreso desde `desde` hasta `hasta`
        // (en %). Mientras dura, aparece una capa dorada sobre el relleno (en vez
        // del azul habitual) para que el avance no pase desapercibido; al terminar,
        // se desvanece de vuelta. Ver .destacadoProgreso en home.css: es una capa
        // aparte con su propia transición de opacidad (no se cambia el `background`
        // del relleno directamente) porque un color sólido no se puede animar de
        // forma fluida hacia/desde un gradiente con esa propiedad.
        function animarBarraProgreso(desde, hasta) {
            if (desde === hasta) return;
            const rellenoProgreso = document.getElementById('rellenoProgreso');
            const destacadoProgreso = document.getElementById('destacadoProgreso');
            const duracionMs = 1200;
            destacadoProgreso.style.opacity = '1';
            rellenoProgreso.style.transition = `width ${duracionMs}ms ease, height ${duracionMs}ms ease`;
            rellenoProgreso.style.width = hasta + '%';
            rellenoProgreso.style.height = hasta + '%';
            setTimeout(() => {
                destacadoProgreso.style.opacity = '0';
            }, duracionMs);
        }

        const { jsPDF } = window.jspdf;

        function descargarCertificado() {
            if (!confirm("¿Quieres descargar tu certificado de finalización?")) return;

            // Crear el documento en formato A4 horizontal
            const doc = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: 'a4'
            });

            // Tamaño de la página A4 horizontal
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const colorBlanco = [255, 255, 255];
            const colorNegro = [220, 220, 220];

            // 1. Establecer el fondo en color #0070C0
            doc.setFillColor("#0070C0");
            doc.rect(0, 0, pageWidth, pageHeight, 'F'); // 'F' para llenar la forma con el color

            // 2. Agregar un borde blanco
            doc.setDrawColor(...colorBlanco); // Color blanco
            doc.setLineWidth(3); // Grosor del borde
            doc.rect(10, 10, pageWidth - 20, pageHeight - 20); // Margen de 10mm

            // 3. Agregar el logotipo


            // 4. Título principal del certificado en letras blancas
            doc.setFont("helvetica", "bold");
            doc.setFontSize(30);
            doc.setTextColor(...colorBlanco);
            doc.text("Certificado de Finalización", pageWidth / 2, 50, { align: "center" });

            // 5. Nombre del alumno
            doc.setFontSize(22);
            var tratamiento = sessionStorage.getItem("genero") == "hombre" ? "don" : "doña";
            doc.setTextColor(...colorNegro);
            doc.text(`Este certificado se otorga a ${tratamiento}:`, pageWidth / 2, 90, { align: "center" });
            doc.setFontSize(30);
            var nombreAlumno = sessionStorage.getItem("nombre") + " " + sessionStorage.getItem("apellidos");
            doc.setTextColor(...colorBlanco);
            doc.text(`${nombreAlumno}`, pageWidth / 2, 105, { align: "center" });

            // 6. Descripción del logro
            doc.setFontSize(18);
            doc.setTextColor(...colorNegro);
            doc.text(
                "Por haber completado satisfactoriamente el curso «Domina el acento británico»",
                pageWidth / 2,
                125,
                { align: "center" }
            );

            // 7. Fecha
            doc.setTextColor(...colorBlanco);
            doc.text(`Fecha: ${cursoFinalizado}`, pageWidth / 2, 175, { align: "center" });

            // 8. Agregar la firma (como una imagen)

            // 9. Guardar el PDF
            doc.save(`certificado-finalización.pdf`);
        }

    </script>
</body>

</html>
