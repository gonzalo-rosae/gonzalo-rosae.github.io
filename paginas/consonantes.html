<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal práctica</title>
    <link rel="icon" href="../imagenes/logo_redondo.png" type="images/x-icon">
    <link rel="stylesheet" href="../estilos/general.css">
    <link rel="stylesheet" href="../estilos/menu.css">
    <script src="../scripts/general.js"></script>
</head>

<body>
    <a id="flechaAtras" href="javascript:void(0);" onclick="window.history.back();">←</a>
    <div class="container">
        <h1>Consonantes</h1>
        <div class="contenedorBotones">
            <div class="filaBtn">
                <button id="btn1" class="btnSeccion prohibido" data-atajo="1" onclick="prohibido()"><span class="textoBtn">🔒</span></button>
            </div>
            <div class="filaBtn">
                <button id="btn2" class="btnSeccion prohibido" data-atajo="2" onclick="prohibido()"><span class="textoBtn">🔒</span></button>
            </div>
            <div class="filaBtn btnPartido">
                <button id="btn3" class="btnSeccion prohibido" data-atajo="3" onclick="prohibido()"><span class="textoBtn">🔒</span></button>
                <button id="btn4" class="btnSeccion prohibido" data-atajo="4" onclick="prohibido()"><span class="textoBtn">🔒</span></button>
            </div>
            <div class="filaBtn btnPartido">
                <button id="btn5" class="btnSeccion prohibido" data-atajo="5" onclick="prohibido()"><span class="textoBtn">🔒</span></button>
                <button id="btn6" class="btnSeccion prohibido" data-atajo="6" onclick="prohibido()"><span class="textoBtn">🔒</span></button>
            </div>
            <div class="filaBtn">
                <button id="btn7" class="btnSeccion prohibido" data-atajo="7" onclick="prohibido()"><span class="textoBtn">🔒</span></button>
            </div>
            <div class="filaBtn">
                <button id="btn8" class="btnSeccion prohibido" data-atajo="8" onclick="prohibido()"><span class="textoBtn">🔒</span></button>
            </div>
        </div>
    </div>
    <button id="btnTextos" class="" alt="Textos práctica" data-atajo="t" onclick="irAPagina('textos')">🗒️</button>

    <script>
        window.onload = function () {
            const identificador = sessionStorage.getItem('idUsuario');
            const token = sessionStorage.getItem('token');
            const progreso = parseInt(sessionStorage.getItem('progreso'), 10);

            if (!(identificador && tokenEsValido(token, identificador))) {
                cerrarSesion();
            } else {
                cargarInfoBotones('../json/catalogos/consonantes.json', progreso, 'consonantes');
                actualizarInsigniaTextos('consonantes', '../json/textos/consonantes.json', progreso);
            }
        }

        // Si el navegador restaura esta página desde la bfcache (p. ej. al volver
        // con el botón "atrás"), window.onload no se vuelve a disparar por su
        // cuenta y las insignias quedarían congeladas con el estado de antes de
        // salir. Forzamos su recálculo en ese caso.
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) window.onload();
        });

        document.addEventListener('keydown', function (event) {
            if (event.key >= '1' && event.key <= '8') {
                let buttonId = 'btn' + event.key;

                let button = document.getElementById(buttonId);

                if (button) {
                    button.click();
                }
            } else if (event.key === 't' || event.key === 'T') {
                document.getElementById('btnTextos').click();
            }
        });
    </script>
</body>

</html>
