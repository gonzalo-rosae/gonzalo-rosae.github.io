<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal práctica</title>
    <link rel="icon" href="../imagenes/logo_redondo.png" type="images/x-icon">
    <link rel="stylesheet" href="../estilos/general.css">
    <link rel="stylesheet" href="../estilos/textos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
    <script src="../scripts/general.js"></script>
    <script src="../scripts/textos.js"></script>
</head>

<body>
    <a id="flechaAtras" href="javascript:void(0);" onclick="window.history.back();">←</a>
        <h1 id="titulo"></h1>
        <!-- Grupo de pregunta y botón -->
        <div class="grupo">
            <div id="nombre"></div>
            <div id="contenido">Texto</div>
            <div id="botonesVelocidad">
                <button id="btnReducirVelocidad" class="boton" data-atajo="−" onclick="cambiarVelocidadAudio(event, -0.25)"
                    oncontextmenu="cambiarVelocidadAudio(event, -1)">➖</button>
                <span id="btnVelocidadAudio" class="boton" oncontextmenu="cambiarVelocidadAudio(event, 0)">x1</span>
                <button id="btnAumentarVelocidad" class="boton" data-atajo="+" onclick="cambiarVelocidadAudio(event, 0.25)"
                    oncontextmenu="cambiarVelocidadAudio(event, 1)">➕</button>
            </div>
            <button id="btnMarcas" class="boton" data-atajo="m" onclick="alternarMarcas()">🚀</button>
            <button id="btnTranscripciones" class="boton" data-atajo="t" onclick="alternarTranscripciones()">👄</button>
            <div id="botonesReproduccion">
                <button id="btnAnterior" class="boton" data-atajo="←" onclick="cargarNuevoTexto(-1)">⏪</button>
                <button id="btnReanudarAudio" class="boton" data-atajo="r" onclick="reanudarAudio()">▶️</button>
                <button id="btnPararAudio" class="boton" data-atajo="x" onclick="reiniciarAudio()">⏹️</button>
                <button id="btnPosterior" class="boton" data-atajo="→" onclick="cargarNuevoTexto(1)">⏩</button>
            </div>
        </div>
</body>

</html>
